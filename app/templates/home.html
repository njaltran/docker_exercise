{% extends "base.html" %}
{% block title %}Home{% endblock %}
{% block content %}
    <h1>Hello {{ name }}!</h1>
    <p>This page has been seen {{ count }} times.</p>
    <img src="{{ url_for('static', filename='hwr.png') }}" alt="HWR Berlin logo" width="200">
    <ul>
        {% for i in range(1, count + 1) %}
        <li>{{ i }}: Hello {{ name }}!</li>
        {% endfor %}
    </ul>
{% endblock %}
